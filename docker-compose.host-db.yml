# Override untuk VPS yang sudah memiliki MySQL/MariaDB di host (misalnya aaPanel).
# Dipakai lewat:
#   docker compose -f docker-compose.yml -f docker-compose.host-db.yml up -d --build --no-deps api
services:
  api:
    depends_on: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${HOST_DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
